{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} - Los Menos Buscados</title>
    <link rel="stylesheet" href="{% static 'carteles_criminale/css/style.css' %}">
</head>
<body>

    <main class="formulario-contenedor">
        <section class="formulario-panel">
            <h1>{{ titulo }}</h1>

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                {{ formulario.non_field_errors }}

                {% for campo in formulario %}
                    <label for="{{ campo.id_for_label }}">
                        {{ campo.label }}
                    </label>

                    {{ campo }}

                    {% if campo.errors %}
                        <div class="error-lista">
                            {{ campo.errors }}
                        </div>
                    {% endif %}
                {% endfor %}

                <button type="submit" class="btn-crear">
                    GUARDAR CARTEL
                </button>
            </form>

            <p>
                <a href="{% url 'display' %}">
                    VOLVER A LOS CARTELES
                </a>
            </p>
        </section>
    </main>

</body>
</html>
